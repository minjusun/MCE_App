<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0F0C22">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BINDER — collect, trade, sell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070C;--surface:rgba(255,255,255,.045);--surface2:rgba(255,255,255,.08);--ink:#F4F4FA;--muted:#9C9CB4;--line:rgba(255,255,255,.09);
  --accent:#8B6CFF;--accent-ink:#FFFFFF;--accent-soft:rgba(139,108,255,.2);--up:#2BD67B;--down:#FF5A5F;
  --plastic:linear-gradient(160deg,#4A4A5E,#22222F);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:#07070C;background-image:radial-gradient(900px 560px at 85% -10%,rgba(124,77,255,.32),transparent 62%),radial-gradient(760px 520px at -10% 35%,rgba(40,110,255,.16),transparent 60%),linear-gradient(180deg,#110D26 0%,#07070C 60%);background-attachment:fixed;min-height:100vh;color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.015em}
h1{font-size:30px;font-weight:800;line-height:1.1}
h2{font-size:21px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.025);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 22px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.03em}
.brand i{width:22px;height:30px;border-radius:5px;background:linear-gradient(140deg,#7B5CFF,#3AD0FF 55%,#FFD45C);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.6);transform:rotate(-8deg)}
.navbtn{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;background:none;border-radius:12px;color:var(--muted);font-weight:600;text-align:left}
.navbtn:hover{color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn .pip{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;display:grid;place-items:center;padding:0 5px}
.wallet{margin-top:auto;padding:14px;border-radius:16px;background:var(--surface2)}
.wallet b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:22px}
.navfoot{padding:12px 4px 0;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-align:left}
.mobilebar{display:none;align-items:center;justify-content:space-between;margin-bottom:18px}
.mobilebar .brand{padding:0}
.chip-wallet{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
main{padding:30px clamp(16px,4vw,44px) 80px;max-width:1200px;width:100%}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .nav{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:30}
  .nav .brand,.wallet,.navfoot{display:none}
  .navbtn{flex:1;flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;align-items:center}
  .navbtn .pip{position:absolute;top:2px;right:calc(50% - 22px);margin:0}
  main{padding:18px 16px 120px}
  .mobilebar{display:flex}
  h1{font-size:26px}
  .navbtn[data-v="wishlist"],.navbtn[data-v="people"]{display:none}
  .fab{display:flex}
  .hide-m{display:none}
}

/* buttons, chips, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 16px;background:var(--surface);font-weight:600}
.ghost:hover{border-color:var(--muted)}
.danger{color:var(--down)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--ink);box-shadow:0 1px 3px rgba(20,25,60,.15)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.search{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500}
.search{max-width:420px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* collection header */
.hero{margin-top:14px;padding-top:18px;text-align:center;background:radial-gradient(60% 45% at 50% 0%,rgba(139,108,255,.16),transparent 70%)}
.hero .lbl-sm{font-size:13px;color:var(--muted);font-weight:600}
.hero .total{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(44px,8vw,66px);line-height:1;letter-spacing:-.045em;margin:8px 0 10px}
.gain{display:inline-flex;gap:6px;align-items:center;font-weight:700;font-size:15px;padding:5px 12px;border-radius:999px;background:color-mix(in srgb,var(--up) 14%,transparent)}
.gain.down{background:color-mix(in srgb,var(--down) 14%,transparent)}
.hero svg{width:100%;height:160px;display:block;margin-top:18px}
.ranges{display:flex;justify-content:center;gap:4px;margin-top:10px;flex-wrap:wrap}
.ranges button{border:0;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:6px 13px;border-radius:999px}
.ranges button[aria-pressed="true"]{background:var(--surface2);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:22px}
.stats div{background:var(--surface);border-radius:16px;padding:12px 8px;font-size:12.5px;color:var(--muted)}
.stats b{display:block;font-size:19px;color:var(--ink);font-family:"Bricolage Grotesque",sans-serif}
.prow{display:flex;align-items:center;gap:14px;width:100%;padding:10px 14px 10px 10px;border:0;border-radius:16px;background:var(--surface);text-align:left}
.prow:hover{background:var(--surface2)}
.prow .pimg{width:58px;height:78px;flex:none;display:grid;place-items:center}
.prow .pimg .tile{width:48px}.prow .pimg .slab{width:54px;padding:3px 3px 5px}.prow .pimg .box{width:56px}
.prow .pimg .tn,.prow .pimg .no,.prow .pimg .txt{display:none}
.prow .pimg .lbl{font-size:0;padding:0;height:7px;margin-bottom:3px}.prow .pimg .lbl b{font-size:0}
.prow .grow{flex:1;min-width:0}
.prow .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .tag{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.prow .pr{text-align:right;font-weight:800;font-size:15.5px}
.prow .pr small{display:block;font-size:12.5px;font-weight:700}
.fab{display:none;flex:none;width:54px;height:54px;margin-top:-24px;border-radius:50%;border:0;background:linear-gradient(140deg,#8B6CFF,#4F7BFF);color:#fff;align-items:center;justify-content:center;box-shadow:0 10px 24px -6px rgba(139,108,255,.65),0 0 0 5px var(--bg)}
.fab svg{width:24px;height:24px}
.mbtns{display:flex;gap:8px;align-items:center}
.ibtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.ibtn svg{width:19px;height:19px}
@media (max-width:520px){.stats div{font-size:11.5px}.stats b{font-size:17px}}

/* item grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.item{display:flex;flex-direction:column;gap:8px;text-align:left;border:0;background:none;padding:0}
.thumb{position:relative;aspect-ratio:3/4;display:grid;place-items:center;border-radius:18px;background:var(--surface);border:1px solid transparent;padding:12px}
.item:hover .thumb{border-color:var(--muted)}
.thumb .flag{position:absolute;top:8px;left:8px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--ink);color:var(--bg)}
.it-name{font-weight:700;line-height:1.25;font-size:14.5px}
.it-meta{font-size:12.5px;color:var(--muted);margin-top:1px}
.it-price{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px}
.it-price small{font-size:12px;font-weight:600}
.empty{padding:40px 20px;border:1.5px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}

/* card art (placeholder, original) */
.tile{--c1:#888;--c2:#ccc;position:relative;width:64%;aspect-ratio:5/7;border-radius:7px;background:linear-gradient(140deg,var(--c1),var(--c2));overflow:hidden;color:#fff;box-shadow:inset 0 0 0 3px rgba(255,255,255,.4),0 6px 14px -6px rgba(15,20,50,.45)}
.tile .win{position:absolute;inset:13% 9% 36%;border-radius:3px;background:radial-gradient(circle at 50% 62%,rgba(255,255,255,.6) 0 17%,transparent 18%),radial-gradient(circle at 50% 62%,rgba(255,255,255,.18) 0 30%,transparent 31%),linear-gradient(180deg,rgba(255,255,255,.28),rgba(0,0,0,.14))}
.tile .tn{position:absolute;left:9%;right:9%;top:3.5%;font-size:9px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tile .txt{position:absolute;left:10%;right:10%;top:70%;height:3px;border-radius:2px;background:rgba(255,255,255,.45);box-shadow:0 7px 0 rgba(255,255,255,.32),0 14px 0 rgba(255,255,255,.22)}
.tile .no{position:absolute;left:9%;bottom:3.5%;font-size:8px;font-weight:600;opacity:.92}
.foil::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:radial-gradient(circle at var(--mx,30%) var(--my,20%),rgba(255,255,255,.75),transparent 46%),
  linear-gradient(115deg,transparent 28%,rgba(255,150,255,.55) 40%,rgba(120,240,255,.55) 50%,rgba(255,255,150,.5) 60%,transparent 72%);
  background-size:100% 100%,260% 260%;background-position:0 0,var(--fx,40%) 0}
.slab{width:72%;padding:6px 6px 10px;border-radius:9px;background:var(--plastic);box-shadow:inset 0 0 0 1px rgba(0,0,0,.09),0 8px 16px -8px rgba(15,20,50,.45)}
.slab .lbl{display:flex;justify-content:space-between;align-items:center;gap:4px;background:#fff;color:#1a1a1a;border:1.5px solid var(--gc,#C9302C);border-radius:4px;padding:3px 5px;font-size:8px;font-weight:700;margin-bottom:6px;line-height:1.15}
.slab .lbl span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.slab .lbl b{color:var(--gc,#C9302C);font-size:12px;flex:none}
.slab .tile{width:100%;box-shadow:inset 0 0 0 3px rgba(255,255,255,.4)}
.box{position:relative;width:80%;aspect-ratio:5/6;border-radius:8px;background:linear-gradient(150deg,var(--c1),var(--c2));overflow:hidden;color:#fff;box-shadow:inset 0 -16px 0 rgba(0,0,0,.2),0 10px 18px -8px rgba(15,20,50,.5)}
.box .band{position:absolute;left:-10%;right:-10%;top:34%;height:22%;background:rgba(255,255,255,.24);transform:rotate(-9deg)}
.box .tn{position:absolute;left:9%;right:9%;bottom:20%;font-size:10px;font-weight:800;line-height:1.15;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.box .no{position:absolute;left:9%;top:8%;font-size:8px;font-weight:700;letter-spacing:.04em;opacity:.9}
.mini{width:46px;height:56px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--surface2)}
.mini .tile{width:28px}.mini .slab{width:34px;padding:2px 2px 4px;border-radius:4px}.mini .box{width:38px}
.mini .tn,.mini .no,.mini .txt{display:none}
.mini .lbl{font-size:0;padding:0;height:5px;margin-bottom:2px;border-width:1px}
.mini .lbl b{font-size:0}
@media (prefers-reduced-motion:no-preference){.foil::after{transition:background-position .15s ease-out}}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.lrow .grow{flex:1;min-width:0}
.lrow .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .s{font-size:13px;color:var(--muted)}
.section-h{margin:30px 0 12px;display:flex;align-items:baseline;gap:10px}
.section-h .count{color:var(--muted);font-weight:600;font-size:14px}

/* trades */
.trade{border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:18px}
.trade + .trade{margin-top:12px}
.tsides{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start;margin:14px 0}
.tside{background:var(--surface2);border-radius:14px;padding:12px}
.tside h3{font-size:13px;color:var(--muted);font-family:Figtree,sans-serif;font-weight:600;margin-bottom:8px}
.titem{display:flex;align-items:center;gap:10px;font-size:13.5px;margin-top:6px}
.titem .grow{flex:1;min-width:0}
.titem .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cash{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--accent-soft);font-weight:700;font-size:13.5px}
.swap{align-self:center;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.status.pending{background:var(--accent-soft);color:var(--accent)}
.status.accepted{color:var(--up)}
.net{font-weight:700}
@media (max-width:640px){.tsides{grid-template-columns:1fr}.swap{transform:rotate(90deg);justify-self:center}}

/* people */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.person{padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-family:"Bricolage Grotesque",sans-serif;flex:none}
.av.lg{width:68px;height:68px;font-size:24px}
.pstats{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.pstats b{color:var(--ink);display:block;font-size:15px}
.peek{display:flex;gap:6px}

/* messages */
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);height:min(640px,calc(100vh - 170px));border-radius:22px;overflow:hidden;background:var(--surface);border:1px solid var(--line);margin-top:18px}
.threads{border-right:1px solid var(--line);overflow:auto}
.thread{display:flex;gap:12px;align-items:center;width:100%;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.thread[aria-current="true"]{background:var(--surface2)}
.thread .grow{flex:1;min-width:0}
.thread .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.convo{display:flex;flex-direction:column;min-height:0}
.convo-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:75%;padding:9px 13px;border-radius:16px;background:var(--surface2);align-self:flex-start;line-height:1.4}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bub.sys{align-self:center;background:none;color:var(--muted);font-size:12.5px;text-align:center}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.composer input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.back{display:none}
.convo .empty{margin:auto;border:0}
@media (max-width:820px){
  .chat{grid-template-columns:1fr;height:calc(100vh - 230px)}
  .chat.has-active .threads{display:none}
  .chat:not(.has-active) .convo{display:none}
  .back{display:inline-flex}
}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,12,30,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.open{display:flex}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:#15121F;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.modal.wide{width:min(860px,100%)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;flex:none}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.detail{display:grid;grid-template-columns:200px 1fr;gap:20px}
.detail .thumb{border:0;background:var(--surface2)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.kv dt{font-size:12px;color:var(--muted)}.kv dd{margin:0;font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.catrow{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border:0;border-radius:12px;background:none;text-align:left}
.catrow:hover{background:var(--surface2)}
.catrow .grow{flex:1;min-width:0}
.catrow .t{font-weight:700}
.catrow .s{font-size:12.5px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.picklist{display:flex;flex-direction:column;gap:6px;max-height:280px;overflow:auto;margin-top:8px;padding-right:2px}
.pick{display:flex;align-items:center;gap:10px;padding:7px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left}
.pick .grow{flex:1;min-width:0}
.pick .t{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .s{font-size:12px;color:var(--muted)}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.cashrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.money-in{display:flex;align-items:center;gap:4px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.money-in input{width:90px;border:0;background:none;padding:10px 0;outline:none}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.summary div{padding:12px 14px;border-radius:14px;background:var(--surface2)}
.summary b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:22px}
.fair{margin-top:10px;font-weight:600;font-size:14px}
.receipt{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--surface2)}
.receipt div{display:flex;justify-content:space-between}
.receipt .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800}
@media (max-width:640px){
  .overlay{align-items:flex-end;padding:0}
  .modal,.modal.wide{width:100%;border-radius:24px 24px 0 0;max-height:92vh;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .detail{grid-template-columns:1fr}.detail .thumb{max-width:220px;margin:0 auto;width:100%}
  .cols{grid-template-columns:1fr}
}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:no-preference){.toast{transition:opacity .2s,transform .2s}}
@media (max-width:820px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.searchbar{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-top:16px}
.searchbar:focus-within{border-color:var(--accent)}
.searchbar svg{width:18px;height:18px;color:var(--muted);flex:none}
.searchbar input{flex:1;min-width:0;border:0;background:none;padding:13px 0;outline:none;font-size:15px}
.hgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;min-width:0}
.panel.glow{background:linear-gradient(150deg,rgba(139,108,255,.22),rgba(79,123,255,.06) 60%,rgba(255,255,255,.03))}
.pv{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:40px;letter-spacing:-.04em;line-height:1.05;margin:8px 0}
.panel svg{width:100%;height:76px;display:block;margin-top:12px}
.plbl{font-weight:600;font-size:13px;color:var(--muted)}
.todo{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.todo button{display:flex;justify-content:space-between;align-items:center;padding:11px 13px;border-radius:12px;border:0;background:var(--surface2);text-align:left;font-weight:600}
.todo b{min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--ink);font-size:13px}
.hscroll{display:grid;grid-auto-flow:column;grid-auto-columns:160px;gap:14px;overflow-x:auto;padding-bottom:8px}
.sh{justify-content:space-between}
.ibadge{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
@media (max-width:700px){.hgrid{grid-template-columns:1fr}.pv{font-size:34px}}
@media (max-width:820px){
  .fab{display:flex}
  .hide-m{display:none!important}
  .navbtn[data-v="wishlist"],.navbtn[data-v="people"],.navbtn[data-v="messages"],.navbtn[data-v="search"]{display:none}
  .nav{background:rgba(13,10,26,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <main id="view"></main>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============ Catalog + pricing ============ */
// PRICING: this is the one place to swap in a real feed (TCGplayer API, or pokemontcg.io which returns TCGplayer market prices).
// Values below are sample numbers for the demo.
const CATALOG = [
  {id:'sv151-199', name:'Charizard ex', set:'Scarlet & Violet 151', num:'199/165', game:'Pokémon', type:'fire', market:118},
  {id:'mew151', name:'Mew ex (gold)', set:'Scarlet & Violet 151', num:'205/165', game:'Pokémon', type:'psychic', market:32},
  {id:'evs-215', name:'Umbreon VMAX (alt art)', set:'Evolving Skies', num:'215/203', game:'Pokémon', type:'dark', market:640},
  {id:'evs-218', name:'Rayquaza VMAX (alt art)', set:'Evolving Skies', num:'218/203', game:'Pokémon', type:'dragon', market:420},
  {id:'pre-161', name:'Umbreon ex (SIR)', set:'Prismatic Evolutions', num:'161/131', game:'Pokémon', type:'dark', market:980},
  {id:'svp-085', name:'Pikachu with Grey Felt Hat', set:'SV Black Star Promos', num:'085', game:'Pokémon', type:'electric', market:520},
  {id:'base-4', name:'Charizard (holo)', set:'Base Set', num:'4/102', game:'Pokémon', type:'fire', market:410},
  {id:'obf-223', name:'Charizard ex (SIR)', set:'Obsidian Flames', num:'223/197', game:'Pokémon', type:'fire', market:95},
  {id:'paf-234', name:'Charizard ex (SIR)', set:'Paldean Fates', num:'234/091', game:'Pokémon', type:'fire', market:80},
  {id:'svi-245', name:'Gardevoir ex (SIR)', set:'Scarlet & Violet', num:'245/198', game:'Pokémon', type:'psychic', market:28},
  {id:'op01-120', name:'Shanks (alt art)', set:'Romance Dawn', num:'OP01-120', game:'One Piece', type:'opred', market:180},
  {id:'dmu-107', name:'Sheoldred, the Apocalypse', set:'Dominaria United', num:'107', game:'Magic', type:'mtg', market:80},
  {id:'lob-001', name:'Blue-Eyes White Dragon', set:'Legend of Blue Eyes', num:'LOB-001', game:'Yu-Gi-Oh!', type:'ygo', market:140},
  {id:'s-151upc', name:'151 Ultra-Premium Collection', set:'Scarlet & Violet 151', num:'UPC', game:'Pokémon', type:'sealed1', market:140, sealed:true},
  {id:'s-evsbb', name:'Evolving Skies Booster Box', set:'Evolving Skies', num:'BOOSTER BOX', game:'Pokémon', type:'sealed2', market:1350, sealed:true},
  {id:'s-preetb', name:'Prismatic Evolutions Elite Trainer Box', set:'Prismatic Evolutions', num:'ETB', game:'Pokémon', type:'sealed3', market:95, sealed:true},
  {id:'s-op05bb', name:'Awakening of the New Era Booster Box', set:'OP-05', num:'BOOSTER BOX', game:'One Piece', type:'sealed4', market:210, sealed:true},
];
const COLORS = {fire:['#FF6A3D','#FFD36E'],psychic:['#B86BFF','#7FD1FF'],dark:['#2E3170','#9A8CFF'],dragon:['#159D92','#F2C14E'],electric:['#FFB703','#FF7A3D'],
  opred:['#D62839','#F4B860'],mtg:['#6D4C41','#D9BE94'],ygo:['#3451D1','#9FD8F5'],sealed1:['#3A1C71','#D76D77'],sealed2:['#0F4C75','#3AC6C0'],sealed3:['#7B2FF7','#F107A3'],sealed4:['#9D0208','#F48C06']};
const GRADERS = {PSA:'#C9302C', BGS:'#1F1F1F', CGC:'#1E5AA8'};
const COND = {NM:1, LP:.85, MP:.7, HP:.5};
const CONDNAME = {NM:'Near Mint', LP:'Lightly Played', MP:'Moderately Played', HP:'Heavily Played'};
const SELLER_FEE = .06;

const Pricing = {
  market(cardId){ return cat(cardId).market; },           // replace with API lookup + cache
  change7d(cardId){ return ((hash(cardId) % 2100) / 100) - 8; }
};
const cat = id => CATALOG.find(c => c.id === id);
function hash(s){let h=2166136261;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const round = n => Math.round(n*100)/100;
function value(i){
  const m = Pricing.market(i.cardId);
  if (i.form === 'sealed') return m;
  if (i.form === 'slab') return round(m * (i.grade>=10 ? 3.2 : i.grade>=9 ? 1.5 : i.grade>=8 ? 1.15 : 1));
  return round(m * (COND[i.cond] || 1));
}
function label(i){
  if (i.form === 'sealed') return 'Sealed';
  if (i.form === 'slab') return `${i.grader||'Any grader'} ${i.grade}`;
  return i.cond ? `Raw, ${i.cond}` : 'Raw';
}

/* ============ Helpers ============ */
const $ = s => document.querySelector(s);
const money = n => '$' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => '$' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Math.random().toString(36).slice(2,9);
const pct = n => (n>=0?'+':'') + n.toFixed(1) + '%';
const sum = a => a.reduce((x,y)=>x+y,0);

/* ============ State ============ */
function seed(){
  const items = [];
  const mk = (owner, cardId, form, extra={}) => { const it = {uid:uid('i'), owner, cardId, form, ...extra}; items.push(it); return it.uid; };
  const y1 = mk('you','sv151-199','raw',{cond:'NM'});
  mk('you','mew151','raw',{cond:'NM'});
  mk('you','evs-215','slab',{grader:'PSA',grade:9});
  mk('you','s-151upc','sealed');
  mk('you','svi-245','raw',{cond:'LP'});
  mk('you','dmu-107','raw',{cond:'NM'});
  const a1 = mk('ashley','pre-161','raw',{cond:'NM'});
  const a2 = mk('ashley','evs-218','raw',{cond:'NM'});
  const a3 = mk('ashley','svp-085','slab',{grader:'PSA',grade:10});
  mk('ashley','s-preetb','sealed');
  const k1 = mk('kaito','base-4','slab',{grader:'PSA',grade:8});
  mk('kaito','lob-001','raw',{cond:'LP'});
  const k3 = mk('kaito','obf-223','raw',{cond:'NM'});
  const s1 = mk('slab','sv151-199','slab',{grader:'PSA',grade:10});
  const s2 = mk('slab','mew151','slab',{grader:'CGC',grade:10});
  mk('slab','paf-234','slab',{grader:'BGS',grade:9});
  const s4 = mk('slab','s-evsbb','sealed');
  const m1 = mk('mira','op01-120','raw',{cond:'NM'});
  const m2 = mk('mira','s-op05bb','sealed');
  mk('mira','svi-245','raw',{cond:'NM'});
  const list = (itemUid, f) => ({id:uid('l'), itemUid, price:round(value(items.find(i=>i.uid===itemUid))*f)});
  const now = Date.now(), h = 3600e3;
  return {
    wallet: 500,
    isPublic: true,
    users: {
      you:{name:'You',handle:'you',tag:'Your public binder',color:'#3A4BFF',rating:5,trades:12,wants:[]},
      ashley:{name:'Ashley R.',handle:'ashley.pulls',tag:'Alt-art hunter. Ships next day.',color:'#E0458B',rating:4.9,trades:128,wants:['sv151-199','mew151']},
      kaito:{name:'Kaito M.',handle:'kaito_tcg',tag:'Vintage Pokémon and Yu-Gi-Oh! slabs.',color:'#0FA3B1',rating:4.8,trades:64,wants:['evs-215','sv151-199']},
      slab:{name:'Slab City',handle:'slabcity',tag:'Graded only. PSA 10 or bust.',color:'#E07A1F',rating:4.7,trades:311,wants:['pre-161','evs-215']},
      mira:{name:'Mira K.',handle:'mira.op',tag:'One Piece first, Pokémon second.',color:'#7A5AF8',rating:5.0,trades:41,wants:['op01-120','svi-245','sv151-199']},
    },
    items,
    listings: [list(a1,1.04),list(a2,.95),list(a3,.98),list(k1,1.02),list(k3,.96),list(s1,1.05),list(s2,.97),list(s4,1.01),list(m1,.93),list(m2,1.03)],
    trades: [
      {id:uid('t'), from:'kaito', to:'you', give:[k3], get:[y1], cash:20, payer:'from', note:'My Obsidian Flames Zard plus $20 for your 151 Zard?', status:'pending', ts:now-2*h},
    ],
    wishlist: [
      {id:uid('w'), cardId:'pre-161', form:'raw', target:900},
      {id:uid('w'), cardId:'svp-085', form:'slab', grade:10, target:1500},
      {id:uid('w'), cardId:'evs-218', form:'raw', target:380},
    ],
    requests: [
      {id:uid('r'), user:'mira', cardId:'sv151-199', form:'raw', offer:110, ts:now-5*h},
      {id:uid('r'), user:'ashley', cardId:'mew151', form:'slab', grade:10, offer:95, ts:now-9*h},
      {id:uid('r'), user:'kaito', cardId:'evs-215', form:'slab', grade:9, offer:900, ts:now-26*h},
    ],
    threads: {
      kaito:[{from:'kaito',text:'Saw your 151 Charizard in your binder. Sent you an offer, let me know!',t:now-2*h}],
      ashley:[{from:'you',text:'Is the Umbreon ex still available?',t:now-30*h},{from:'ashley',text:'Yep! Listed on the market, or I’d trade for your Charizard ex plus cash.',t:now-29*h}],
    },
    unread: ['kaito'],
  };
}
let S;
function load(){ try{ const r = localStorage.getItem('topload-v1'); S = r ? JSON.parse(r) : seed(); }catch(e){ S = seed(); } }
function save(){ try{ localStorage.setItem('topload-v1', JSON.stringify(S)); }catch(e){} }
load();
let UI = {view:'home', filter:'all', mtab:'sale', mform:'all', q:'', profile:null, thread:null};

const owned = u => S.items.filter(i => i.owner === u);
const item = id => S.items.find(i => i.uid === id);
const listingOf = itemUid => S.listings.find(l => l.itemUid === itemUid);
const user = id => S.users[id];
function matches(spec, i){ return i.cardId===spec.cardId && i.form===spec.form && (spec.form!=='slab' || !spec.grade || i.grade===spec.grade); }

/* ============ Art ============ */
function tile(i){
  const c = cat(i.cardId), [c1,c2] = COLORS[c.type] || ['#777','#bbb'];
  const style = `--c1:${c1};--c2:${c2}`;
  if (i.form === 'sealed' || c.sealed) return `<div class="box foil" style="${style}"><div class="band"></div><div class="no">${esc(c.num)}</div><div class="tn">${esc(c.name)}</div></div>`;
  const card = `<div class="tile foil" style="${style}"><div class="tn">${esc(c.name)}</div><div class="win"></div><div class="txt"></div><div class="no">${esc(c.num)}</div></div>`;
  if (i.form === 'slab') return `<div class="slab" style="--gc:${GRADERS[i.grader]||'#555'}"><div class="lbl"><span>${esc(i.grader||'')} ${esc(c.name)}</span><b>${i.grade}</b></div>${card}</div>`;
  return card;
}
const mini = i => `<div class="mini" aria-hidden="true">${tile(i)}</div>`;
const avatar = (u, lg) => `<div class="av ${lg?'lg':''}" style="background:${user(u).color}" aria-hidden="true">${esc(user(u).name.replace(/[^A-Za-z ]/g,'').split(' ').map(w=>w[0]).join('').slice(0,2))}</div>`;

/* ============ Icons ============ */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
  collection:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="7" y="3" width="11" height="15" rx="2"/><path d="M4 7v11a3 3 0 0 0 3 3h9"/></svg>',
  market:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>',
  trades:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>',
  wishlist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  messages:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
};

I.shop = I.market; I.portfolio = I.collection;
/* ============ Nav ============ */
const NAV = [['home','Home'],['search','Search'],['shop','Shop'],['portfolio','Portfolio'],['trades','Trades'],['wishlist','Wishlist'],['people','Collectors'],['messages','Messages']];
function renderNav(){
  const pendingIn = S.trades.filter(t=>t.to==='you'&&t.status==='pending').length;
  const unread = S.unread.length;
  $('#nav').innerHTML = `<div class="brand"><i></i>BINDER</div>` +
    NAV.map(([k,l]) => {
      const n = k==='trades'?pendingIn : k==='messages'?unread : 0;
      const cur = UI.view===k || (k==='people'&&UI.view==='profile');
      return `<button class="navbtn" data-act="go" data-v="${k}" ${cur?'aria-current="page"':''}>${I[k]}<span>${l}</span>${n?`<span class="pip">${n}</span>`:''}</button>` + (k==='shop' ? `<button class="fab" data-act="addItem" aria-label="Add item">${I.plus}</button>` : '');
    }).join('') +
    `<div class="wallet"><span class="muted" style="font-size:13px">Wallet balance</span><b>${money(S.wallet)}</b></div>
     <div class="navfoot"><span>Prices are sample data until a pricing feed is connected.</span><button class="linkbtn" data-act="reset">Reset demo data</button></div>`;
}

/* ============ Views ============ */
function mobileBar(){ return `<div class="mobilebar"><div class="brand"><i></i>BINDER</div><div class="mbtns"><button class="ibtn" data-act="go" data-v="search" aria-label="Search">${I.search}</button><button class="ibtn" data-act="go" data-v="wishlist" aria-label="Wishlist">${I.wishlist}</button><button class="ibtn" data-act="go" data-v="messages" aria-label="Messages" style="position:relative">${I.messages}${S.unread.length?'<span class="ibadge"></span>':''}</button><button class="ibtn" data-act="go" data-v="people" aria-label="Collectors">${I.people}</button></div></div>`; }
function itemRow(i){
  const c = cat(i.cardId), L = listingOf(i.uid), ch = Pricing.change7d(i.cardId);
  return `<button class="prow" data-act="item" data-id="${i.uid}"><div class="pimg" aria-hidden="true">${tile(i)}</div>
    <div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.set)} #${esc(c.num)}</div><span class="tag">${esc(label(i))}</span>${L?` <span class="tag" style="color:var(--accent)">Listed ${money0(L.price)}</span>`:''}</div>
    <div class="pr">${money(value(i))}<small class="${ch>=0?'up':'down'}">${pct(ch)}</small></div></button>`;
}

function itemCard(i){
  const c = cat(i.cardId), L = listingOf(i.uid), ch = Pricing.change7d(i.cardId);
  return `<button class="item" data-act="item" data-id="${i.uid}">
    <div class="thumb">${L?`<span class="flag">Listed ${money0(L.price)}</span>`:''}${tile(i)}</div>
    <div><div class="it-name">${esc(c.name)}</div><div class="it-meta">${esc(c.set)}, ${esc(label(i))}</div></div>
    <div class="it-price"><span>${money(value(i))}</span><small class="${ch>=0?'up':'down'}">${pct(ch)}</small></div>
  </button>`;
}

const RANGES = {'1D':[24,.992],'1W':[28,.965],'1M':[30,.9],'3M':[40,.83],'1Y':[52,.66],'ALL':[64,.42]};
function series(total, r){
  const [n,f] = RANGES[r], pts = []; let v = total * f;
  for (let i=0; i<n; i++){ const z = (hash(r+':'+i) % 1000)/1000 - .45; v = v + (total - v) * (2.4/n) + total * z * (1.06 - f) * .22; pts.push(v); }
  pts[n-1] = total; return pts;
}
function sparkline(pts, up){
  const n = pts.length, mn = Math.min(...pts), mx = Math.max(...pts), W=300, H=100, col = up ? 'var(--up)' : 'var(--down)';
  const xy = pts.map((p,i)=>[i/(n-1)*W, H-6-(p-mn)/(mx-mn||1)*(H-16)]);
  const d = xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Portfolio value over the selected range">
    <defs><linearGradient id="sg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".3"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${W} ${H} L0 ${H} Z" fill="url(#sg)"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" vector-effect="non-scaling-stroke"/></svg>`;
}

function vCollection(){
  const mine = owned('you');
  const total = sum(mine.map(value)), range = UI.range || '1M', pts = series(total||1, range), g = total - pts[0], up = g >= 0;
  const rb = r => `<button data-act="range" data-v="${r}" aria-pressed="${range===r}">${r}</button>`;
  const lay = UI.layout === 'grid' ? 'grid' : 'list';
  const n = f => mine.filter(i=>i.form===f).length;
  const shown = UI.filter==='all' ? mine : mine.filter(i=>i.form===UI.filter);
  const chip = (k,l) => `<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${UI.filter===k}">${l}</button>`;
  return `${mobileBar()}
  <div class="spread"><h1>Portfolio</h1><div class="row"><button class="ghost" data-act="togglePublic" aria-pressed="${S.isPublic}">${S.isPublic?'Visible to collectors':'Hidden from collectors'}</button><button class="btn hide-m" data-act="addItem">Add item</button></div></div>
  <section class="hero">

function listingCard(l, i){

function perspective(t){
  const out = t.from === 'you';
  const youGive = out ? t.give : t.get, youGet = out ? t.get : t.give;
  const fromPays = t.payer === 'from';
  const cashToYou = out ? (fromPays ? -t.cash : t.cash) : (fromPays ? t.cash : -t.cash);
  return {them: out ? t.to : t.from, youGive, youGet, cashToYou};
}
function tradeCard(t){
  const p = perspective(t), them = user(p.them);
  const side = (uids, title, cash) => `<div class="tside"><h3>${title}</h3>${uids.map(id=>{const i=item(id); if(!i) return '<div class="titem muted">Item no longer available</div>'; return `<div class="titem">${mini(i)}<div class="grow"><div class="t">${esc(cat(i.cardId).name)}</div><div class="muted">${esc(label(i))}</div></div><b>${money0(value(i))}</b></div>`;}).join('') || '<div class="muted" style="font-size:13px">No cards</div>'}${cash>0?`<div class="cash">+ ${money(cash)} cash</div>`:''}</div>`;
  const vGive = sum(p.youGive.map(id=>item(id)?value(item(id)):0)), vGet = sum(p.youGet.map(id=>item(id)?value(item(id)):0));
  const net = vGet - vGive + p.cashToYou;
  const statusTxt = {pending: t.from==='you'?'Waiting on them':'Needs your answer', accepted:'Completed', declined:'Declined', cancelled:'Cancelled', countered:'Countered'}[t.status];
  return `<article class="trade">
    <div class="spread"><div class="row">${avatar(p.them)}<div><b>${t.from==='you'?'You → '+esc(them.name):esc(them.name)+' → You'}</b><div class="muted" style="font-size:13px">@${esc(them.handle)}, ${new Date(t.ts).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div></div></div><span class="status ${t.status}">${statusTxt}</span></div>
    ${t.note?`<p style="margin-top:12px">“${esc(t.note)}”</p>`:''}
    <div class="tsides">${side(p.youGet,'You get',Math.max(0,p.cashToYou))}<div class="swap" aria-hidden="true">${I.trades}</div>${side(p.youGive,'You give',Math.max(0,-p.cashToYou))}</div>
    <div class="spread"><span class="net ${net>=0?'up':'down'}">${net>=0?'You come out '+money(net)+' ahead':'You give up '+money(-net)+' in value'}</span>
      <div class="row">${t.status==='pending' ? (t.to==='you'
        ? `<button class="ghost" data-act="declineTrade" data-id="${t.id}">Decline</button><button class="ghost" data-act="counter" data-id="${t.id}">Counter</button><button class="btn" data-act="acceptTrade" data-id="${t.id}">Accept trade</button>`
        : `<button class="ghost" data-act="cancelTrade" data-id="${t.id}">Cancel offer</button>`) : ''}</div></div>
  </article>`;
}

  const sec = (title, arr, emptyTxt) => `<div class="section-h"><h2>${title}</h2><span class="count">${arr.length}</span></div>${arr.length?arr.map(tradeCard).join(''):`<div class="empty" style="padding:24px"><p>${emptyTxt}</p></div>`}`;

}

function openItem(id){
  const i = item(id); if (!i) return;

let P = null;
function openPicker(mode, preset={}){
  P = {mode, cardId:preset.cardId||null, form:preset.form||'raw', cond:'NM', grader:'PSA', grade:preset.grade?+preset.grade:10, price:preset.offer||''};

function renderPicker(){

  openModal(`${head(title)}
    <div class="lrow" style="border:0;background:var(--surface2)">${mini(spec)}<div class="grow"><div class="t">${esc(c.name)}</div><div class="s">${esc(c.set)}, #${esc(c.num)}</div></div><button class="linkbtn" data-act="pickCat" data-id="">Change</button></div>
    <div class="stack" style="margin-top:16px">

      ${P.form==='slab' ? `<div class="row" style="align-items:stretch">${P.mode==='add'?`<label class="field" style="flex:1"><span>Grader</span><select id="pgrader">${Object.keys(GRADERS).map(g=>`<option ${P.grader===g?'selected':''}>${g}</option>`).join('')}</select></label>`:''}<label class="field" style="flex:1"><span>Grade</span><select id="pgrade">${[10,9.5,9,8,7].map(g=>`<option ${P.grade==g?'selected':''}>${g}</option>`).join('')}</select></label></div>`:''}
      ${priceField}

function pickDone(){
  const c = cat(P.cardId), price = parseFloat($('#pprice')?.value);
  if (P.mode==='add'){
    const it = {uid:uid('i'), owner:'you', cardId:P.cardId, form:P.form};
    if (P.form==='raw') it.cond = P.cond; if (P.form==='slab'){ it.grader=P.grader; it.grade=P.grade; }
    S.items.push(it); closeModal(); UI.view='portfolio'; render(); toast(`Added ${c.name} to your portfolio.`);
  } else if (P.mode==='wish'){
    if (!(price>0)) return toast('Enter a target price above $0.');

    closeModal(); UI.view='wishlist'; render(); toast(`Added ${c.name} to your wishlist.`);
  } else {
    if (!(price>0)) return toast('Enter an offer above $0.');

}

/* ============ Trade builder ============ */
let B = null;
function openBuilder(o={}){
  const partners = Object.keys(S.users).filter(u=>u!=='you');
  B = {partner:o.partner||partners[0], give:new Set(o.give||[]), get:new Set(o.get||[]), cash:o.cash||0, payer:o.payer||'me', note:o.note||'', counterOf:o.counterOf||null};
  renderBuilder();
}
const pickRow = (i, on, side) => `<button class="pick ${on?'on':''}" data-act="toggle" data-side="${side}" data-id="${i.uid}" aria-pressed="${on}">${mini(i)}<div class="grow"><div class="t">${esc(cat(i.cardId).name)}</div><div class="s">${esc(label(i))}</div></div><b>${money0(value(i))}</b></button>`;
function renderBuilder(){
  const partners = Object.keys(S.users).filter(u=>u!=='you');
  openModal(`${head(B.counterOf?'Counter offer':'Start a trade')}
    <label class="field"><span>Trade with</span><select id="bpartner">${partners.map(u=>`<option value="${u}" ${B.partner===u?'selected':''}>${esc(user(u).name)} (@${esc(user(u).handle)})</option>`).join('')}</select></label>
    <div class="cols">
      <section><h3>You give</h3><div class="picklist">${owned('you').map(i=>pickRow(i,B.give.has(i.uid),'give')).join('') || '<p class="muted">Your collection is empty.</p>'}</div></section>
      <section><h3>You get from ${esc(user(B.partner).name)}</h3><div class="picklist">${owned(B.partner).map(i=>pickRow(i,B.get.has(i.uid),'get')).join('') || '<p class="muted">Their binder is empty.</p>'}</div></section>
    </div>
    <div class="cashrow"><div class="seg"><button data-act="payer" data-v="me" aria-pressed="${B.payer==='me'}">I add cash</button><button data-act="payer" data-v="them" aria-pressed="${B.payer==='them'}">They add cash</button></div>
      <label class="money-in"><span>$</span><input id="bcash" type="number" min="0" step="1" value="${B.cash}" aria-label="Cash amount"></label>
      <button class="ghost" data-act="balance">Even it out</button></div>
    <div id="bsum">${builderSummary()}</div>
    <label class="field" style="margin-top:14px"><span>Note (optional)</span><input id="bnote" value="${esc(B.note)}" placeholder="Shipping, condition notes, anything else"></label>
    <div class="mfoot"><button class="ghost" data-act="close">Cancel</button><button class="btn" data-act="sendTrade">Send offer</button></div>`, true);
}
function builderSummary(){
  const g = sum([...B.give].map(id=>value(item(id)))), r = sum([...B.get].map(id=>value(item(id))));
  const out = g + (B.payer==='me'?B.cash:0), inn = r + (B.payer==='them'?B.cash:0), d = inn - out, base = Math.max(out,inn,1);
  const fair = Math.abs(d)/base < .03 ? 'Even trade, within 3% of market value' : d>0 ? `You’re ${money(d)} ahead. They may counter.` : `They’re ${money(-d)} ahead.`;
  return `<div class="summary"><div><span class="muted">You give</span><b>${money(out)}</b></div><div><span class="muted">You get</span><b>${money(inn)}</b></div></div><p class="fair ${Math.abs(d)/base<.03?'up':d>0?'muted':'down'}">${fair}</p>`;
}
function sendTrade(){
  if (!B.give.size && !B.get.size) return toast('Pick at least one card for the trade.');
  if (!B.get.size && B.payer==='me') return toast('Pick something you want from their binder.');
  if (B.payer==='me' && B.cash > S.wallet) return toast(`You only have ${money(S.wallet)} in your wallet.`);
  const t = {id:uid('t'), from:'you', to:B.partner, give:[...B.give], get:[...B.get], cash:B.cash, payer:B.payer==='me'?'from':'to', note:B.note.trim(), status:'pending', ts:Date.now()};
  if (B.counterOf){ const o = S.trades.find(x=>x.id===B.counterOf); if (o) o.status='countered'; }
  S.trades.push(t); sysMsg(t.to, 'You sent a trade offer.');
  closeModal(); UI.view='trades'; render(); toast(`Offer sent to ${user(t.to).name}.`);
  setTimeout(()=>simulateReply(t.id), 3500);
}
function simulateReply(id){
  const t = S.trades.find(x=>x.id===id); if (!t || t.status!=='pending') return;
  const p = perspective(t);
  const theyGet = sum(p.youGive.map(i=>value(item(i)))) + Math.max(0,-p.cashToYou);
  const theyGive = sum(p.youGet.map(i=>value(item(i)))) + Math.max(0,p.cashToYou);
  if (theyGet >= theyGive*.97 && execTrade(t)) {
    S.threads[t.to].push({from:t.to, text:'Accepted! Shipping out tomorrow.', t:Date.now()});
    toast(`${user(t.to).name} accepted your trade.`);
  } else if (t.status==='pending') {
    t.status = 'declined';
    S.threads[t.to].push({from:t.to, text:`Thanks, but I’m about ${money(theyGive-theyGet)} short on that one. Can you add a bit more?`, t:Date.now()});
    toast(`${user(t.to).name} declined your offer.`);
  }
  if (!S.unread.includes(t.to)) S.unread.push(t.to);
  render();
}
function execTrade(t){
  const ok = t.give.every(id=>item(id)?.owner===t.from) && t.get.every(id=>item(id)?.owner===t.to);
  if (!ok){ t.status='declined'; toast('One of those items is no longer available, so the trade was closed.'); return false; }
  const payer = t.payer==='from' ? t.from : t.to, payee = payer===t.from ? t.to : t.from;
  if (payer==='you' && S.wallet < t.cash){ toast(`You need ${money(t.cash)} in your wallet to accept.`); return false; }
  t.give.forEach(id=>item(id).owner=t.to); t.get.forEach(id=>item(id).owner=t.from);
  S.listings = S.listings.filter(l=>![...t.give,...t.get].includes(l.itemUid));
  if (payer==='you') S.wallet = round(S.wallet - t.cash); if (payee==='you') S.wallet = round(S.wallet + t.cash);
  t.status='accepted'; sysMsg(t.from==='you'?t.to:t.from, 'Trade completed. Ship within 3 days using the label in Trades.');
  return true;
}

  unlist:d=>{S.listings=S.listings.filter(l=>l.itemUid!==d.id); closeModal(); render(); toast('Listing removed.');},
  rmItem:d=>{S.items=S.items.filter(i=>i.uid!==d.id); S.listings=S.listings.filter(l=>l.itemUid!==d.id); closeModal(); render(); toast('Removed from your collection.');},
  buy:d=>openBuy(d.id),
  confirmBuy:d=>{const L=S.listings.find(l=>l.id===d.id); if(!L) return; const i=item(L.itemUid), tot=L.price+(i.form==='raw'?4.99:6.99), seller=i.owner;
    S.wallet=round(S.wallet-tot); i.owner='you'; S.listings=S.listings.filter(l=>l.id!==L.id); S.wishlist=S.wishlist.filter(w=>!matches(w,i));
    sysMsg(seller, `You bought ${cat(i.cardId).name} for ${money(L.price)}.`); closeModal(); render(); toast(`Purchased. ${cat(i.cardId).name} is in your portfolio.`);},
  wishThis:d=>{const i=item(d.id); S.wishlist.push({id:uid('w'), cardId:i.cardId, form:i.form, grade:i.form==='slab'?i.grade:undefined, target:Math.round(value(i)*.95)}); closeModal(); render(); toast('Added to your wishlist.');},
  rmWish:d=>{S.wishlist=S.wishlist.filter(w=>w.id!==d.id); render();},
  fillReq:d=>{const r=S.requests.find(x=>x.id===d.id), i=owned('you').find(x=>matches(r,x)); if(!i) return;
    i.owner=r.user; S.listings=S.listings.filter(l=>l.itemUid!==i.uid); S.requests=S.requests.filter(x=>x.id!==r.id); const net=round(r.offer*(1-SELLER_FEE)); S.wallet=round(S.wallet+net);
    sysMsg(r.user, `You sold ${cat(r.cardId).name} for ${money(r.offer)}.`); render(); toast(`Sold. ${money(net)} added to your wallet after fees.`);},
  cancelReq:d=>{S.requests=S.requests.filter(x=>x.id!==d.id); render(); toast('Request cancelled.');},
  newTrade:d=>openBuilder({partner:d.partner, give:d.give?[d.give]:[], get:d.get?[d.get]:[]}),
  toggle:(d,el)=>{const set=d.side==='give'?B.give:B.get; set.has(d.id)?set.delete(d.id):set.add(d.id); el.classList.toggle('on'); el.setAttribute('aria-pressed', set.has(d.id)); $('#bsum').innerHTML=builderSummary();},
  payer:(d,el)=>{B.payer=d.v; el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===d.v)); $('#bsum').innerHTML=builderSummary();},
  balance:()=>{const g=sum([...B.give].map(id=>value(item(id)))), r=sum([...B.get].map(id=>value(item(id)))); const diff=Math.round(r-g); B.payer=diff>=0?'me':'them'; B.cash=Math.abs(diff); B.note=$('#bnote').value; renderBuilder();},

  acceptTrade:d=>{const t=S.trades.find(x=>x.id===d.id); if(execTrade(t)){ toast('Trade accepted. Ship your card within 3 days.'); } render();},

  dm:d=>{closeModal(); S.threads[d.v] ||= []; if(!S.threads[d.v].length) S.threads[d.v].push({from:'sys', text:`Start of your conversation with ${user(d.v).name}`, t:Date.now()}); UI.view='messages'; UI.thread=d.v; S.unread=S.unread.filter(u=>u!==d.v); render(); setTimeout(()=>$('#msgin')?.focus(),30);},

    setTimeout(()=>{S.threads[u].push({from:u, text:REPLIES[hash(txt)%REPLIES.length], t:Date.now()}); if(UI.view!=='messages'||UI.thread!==u){ if(!S.unread.includes(u)) S.unread.push(u);} render(); if(UI.view==='messages') $('#msgin')?.focus();}, 1600);},
  reset:()=>{S=seed(); UI={view:'home', filter:'all', mtab:'sale', mform:'all', q:'', profile:null, thread:null}; render(); toast('Demo data reset.');},
};
document.addEventListener('click', e => {

  if (e.target.id === 'overlay') closeModal();
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id==='hq'){ UI.sq=e.target.value; UI.view='search'; render(); const s=$('#sq'); s.focus(); s.setSelectionRange(s.value.length,s.value.length); return; }

document.addEventListener('change', e => {

// holo shimmer follows the pointer
document.addEventListener('pointermove', e => {
  const f = e.target.closest?.('.thumb, .mini'); if (!f) return;
  const r = f.getBoundingClientRect(), x = (e.clientX-r.left)/r.width*100, y = (e.clientY-r.top)/r.height*100;
  f.querySelectorAll('.foil').forEach(el=>{ el.style.setProperty('--mx',x+'%'); el.style.setProperty('--my',y+'%'); el.style.setProperty('--fx',(x*.8+10)+'%'); });
});
render();
</script>
</body>
</html>
